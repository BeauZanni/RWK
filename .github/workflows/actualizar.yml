name: Actualizar registros.json

on:
  push:  
    branches:
      - main

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar script
        run: node .github/workflows/ejecutador.js

      - name: Commit cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registros.json
          git commit -m "Bot: actualizar registros.json" || echo "No hay cambios en registros.json"
          git push

